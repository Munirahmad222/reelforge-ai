<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ReelForge AI</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1020"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#0b1020;--card:#141b34;--bd:#263056;--tx:#e8ecff;--mu:#9aa5d1;--ac:#7c6cff;--ac2:#3b82f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=light]{--bg:#f4f5fb;--card:#fff;--bd:#d9dcef;--tx:#151a33;--mu:#5b6490}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
#app{display:flex;min-height:100vh}nav{width:210px;padding:16px;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;flex:none}
nav h1{font-size:18px;margin:0 0 16px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
nav button,.bn button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mu);padding:10px;border-radius:10px;font:inherit;cursor:pointer}
nav button.on,.bn button.on{background:var(--card);color:var(--tx)}
main{flex:1;padding:20px;max-width:900px;width:100%;margin:0 auto;padding-bottom:90px}
h2{margin:0 0 4px}.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
button.b,a.b{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;min-height:44px}
button.s{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer;min-height:40px}
button.chip{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:8px 14px;margin:3px;cursor:pointer;font:inherit}
button.chip.on{border-color:var(--ac);background:rgba(124,108,255,.25)}
input,textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;margin:4px 0}
textarea{min-height:70px;resize:vertical}label{font-size:13px;color:var(--mu)}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.warn{color:#fbbf24}.tag{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:2px 8px;margin:2px}
.bn{display:none}
@media(max-width:720px){nav{display:none}.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}.bn button{text-align:center;font-size:12px;padding:8px 2px}main{padding:14px 14px 90px}}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:9}
:root{--bg:#070b1a;--card:#101733;--bd:#222c55;--tx:#eef1ff;--mu:#97a2cf;--r:16px}
:root[data-theme=light]{--bg:#f3f4fb;--card:#fff;--bd:#dcdff1;--tx:#12172f;--mu:#5a6390}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(124,108,255,.18),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(59,130,246,.14),transparent 60%),var(--bg);background-attachment:fixed;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
nav{width:240px;padding:20px 14px;background:rgba(16,23,51,.55);backdrop-filter:blur(14px);border-right:1px solid var(--bd);flex-direction:column;gap:2px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-size:17px;letter-spacing:-.01em}
.lg{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;box-shadow:0 6px 18px rgba(124,108,255,.45)}
.lg .ic{width:16px;height:16px;fill:#fff;stroke:#fff}
nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--mu);font-weight:500;transition:.15s}
nav button:hover{background:rgba(124,108,255,.1);color:var(--tx)}
nav button.on{background:linear-gradient(90deg,rgba(124,108,255,.28),rgba(59,130,246,.12));color:var(--tx);box-shadow:inset 2px 0 0 var(--ac)}
.ic{width:19px;height:19px;flex:none}
.nf{margin-top:auto;font-size:12px;color:var(--mu);padding:12px;border:1px solid var(--bd);border-radius:12px;background:rgba(255,255,255,.02)}
main{max-width:1060px;padding:36px 40px 90px}
h2{font-size:30px;letter-spacing:-.02em;font-weight:700}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin:30px 0 12px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
button.b,a.b{background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:12px;font-weight:600;box-shadow:0 8px 22px rgba(99,102,241,.4);transition:.15s;text-decoration:none;display:inline-flex;align-items:center}
button.b:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(99,102,241,.5)}
button.s{border-radius:12px;background:rgba(255,255,255,.03);transition:.15s}
button.s:hover{border-color:var(--ac);background:rgba(124,108,255,.12)}
input,textarea,select{border-radius:12px}
input:focus,textarea:focus,select:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 3px rgba(124,108,255,.25)}
button.chip{padding:10px 16px;font-weight:500;transition:.15s}
button.chip:hover{border-color:var(--ac)}
button.chip.on{background:linear-gradient(135deg,rgba(124,108,255,.35),rgba(59,130,246,.25));box-shadow:0 0 0 1px var(--ac) inset}
.g{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:34px;border:1px solid var(--bd);background:linear-gradient(135deg,rgba(124,108,255,.3),rgba(59,130,246,.14) 60%,rgba(16,23,51,.5))}
.hero:after{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(124,108,255,.5),transparent 70%)}
.hero h2{font-size:36px;margin:14px 0 8px}
@media(max-width:720px){.hero:after{opacity:.35;right:-110px;top:-110px}}
.hero p{max-width:520px;color:var(--mu);margin:0 0 22px;font-size:16px}
.hero .row,.hero .tag{position:relative;z-index:1}
.tile{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font:inherit;transition:.15s;min-height:104px}
.tile:hover{transform:translateY(-2px);border-color:var(--ac);box-shadow:0 10px 26px rgba(124,108,255,.25)}
.tile .ti{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(124,108,255,.3),rgba(59,130,246,.2));color:#c9c2ff}
.tile b{font-size:14px}
.bn{background:rgba(16,23,51,.88);backdrop-filter:blur(14px)}
.bn button{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;width:auto;flex:1}
.bn .ic{width:21px;height:21px}
.bn button.on{background:rgba(124,108,255,.2);color:var(--tx)}
@media(max-width:720px){nav{display:none}main{padding:18px 16px 96px}.hero{padding:22px}.hero h2{font-size:27px}h2{font-size:24px}}
</style></head><body><div id="app"><nav id="nav"></nav><main id="main"></main></div><div class="bn" id="bn"></div><div id="toast" role="status"></div>
<script>
const NAV=[['home','Home'],['create','Create Reel'],['script','Script Studio'],['paste','Paste Script'],['editor','Video Editor'],['hooks','Hooks'],['captions','Captions & Hashtags'],['social','Social Tools'],['projects','My Projects'],['templates','Templates'],['settings','Settings'],['help','Help & About']];
const BN=[['home','Home'],['create','Create'],['projects','Projects'],['settings','Settings'],['more','More']];
const CATS=['Motivation','Poetry','Storytelling','Education','Comedy','Business','Product Promotion','Facts','Lifestyle','Custom'];
const PLATS=['TikTok','Instagram Reels','YouTube Shorts','Facebook Reels','General Vertical Video'];
const DURS=[15,30,60,90];
const TONES=['Inspirational','Emotional','Funny','Cinematic','Educational','Professional','Dramatic','Calm'];
const OUTS=['Script','Scene plan','Voice-over text','Caption','Hashtags','Complete reel package'];
const HOOKS={Curiosity:['Nobody tells you this about {t}.','What if everything you know about {t} is incomplete?','There is a hidden side of {t} most people never see.'],'Surprising Fact':['Here is a fact about {t} that may change how you see it.','Most people get {t} wrong. Here is why.'],Question:['Why does {t} matter more than you think?','Have you ever stopped to ask what {t} really means?'],'Emotional Opening':['Some days, {t} is the only thing that keeps me going.','I did not expect {t} to change me this much.'],'Problem and Solution':['Struggling with {t}? Try this simple shift.','Stuck on {t}? Here is a way forward in under a minute.'],'Personal Story':['A year ago, I knew nothing about {t}. Here is what happened next.','Let me tell you how {t} found me.'],Challenge:['Try this for 7 days: focus on {t} and notice what changes.','I dare you to think differently about {t} today.'],'Motivational Statement':['{t} begins the moment you decide to start.','Small steps in {t} become big change.']};
const BODY={Motivation:['Every big result starts with one small, honest step.','{t} is not about being perfect. It is about showing up.','When it gets hard, remember why you began.','Progress is quiet. Keep going anyway.','You are closer to {t} than yesterday.'],Poetry:['Words fall like rain on {t}.','Soft is the light where {t} begins.','What the heart holds, the silence keeps.','Let each line breathe, let each pause speak.','And so {t} remains, gentle and true.'],Storytelling:['It started with a small moment about {t}.','Nobody expected what happened next.','Then something shifted, and everything about {t} looked different.','That is when the real lesson arrived.','And that is why {t} stays with me.'],Education:['Here is the core idea behind {t}.','First, understand the basics.','Second, see how it works in everyday life.','Third, avoid the most common mistake.','Remember this one point about {t} and you are ahead.'],Business:['{t} solves a real problem for real people.','Here is what makes it different.','It saves time and keeps things simple.','Customers can start in minutes.','See how {t} can work for you.'],Default:['Let us talk about {t}.','There is more to it than it seems.','Here is the key point to remember.','Think about how this applies to you.','That is the heart of {t}.']};
const VIS=['Close-up of the subject, soft light','Wide establishing shot','Hands in action, handheld feel','Text-focused slide on a clean background','Slow pan across a relevant scene','Person speaking to camera','Detail shot with shallow focus','Closing shot with space for text'];
const CTAS=['Follow for more.','Save this for later.','Share with someone who needs it.','Comment your thoughts below.'];
const TAGS={Motivation:['motivation','mindset','goals','growth','inspiration'],Poetry:['poetry','poem','words','writersofinstagram','poetrycommunity'],Storytelling:['storytime','story','storytelling','reallife'],Education:['learnontiktok','education','tips','howto','knowledge'],Comedy:['funny','comedy','humor','relatable'],Business:['business','smallbusiness','entrepreneur','marketing'],'Product Promotion':['newproduct','shopsmall','productreview','musthave'],Facts:['didyouknow','facts','funfacts','learnsomethingnew'],Lifestyle:['lifestyle','dailyroutine','selfcare','vlog'],Custom:['reels','shorts','video','creator']};
const TEMPLATES=[['Motivational Quote','Motivation','A short punchy quote over a calm background.','Motivation'],['Poetry Reel','Poetry','Slow verses with on-screen lines (English or Urdu text).','Poetry'],['Story Time','Storytelling','Hook, twist, lesson.','Storytelling'],['Quick Tip','Education','Three steps and a takeaway.','Education'],['Business Promo','Business','Problem, solution, offer.','Business'],['Product Showcase','Product Promotion','Highlight features in short scenes.','Product Promotion'],['Before and After','Lifestyle','Show a change with two contrasting scenes.','Lifestyle'],['Photo Slideshow','Lifestyle','Photos with captions per scene.','Lifestyle'],['Personal Intro','Custom','Who you are, what you do, why follow.','Custom'],['Announcement','Business','One clear message with date and action.','Business'],['Funny Skit','Comedy','Relatable humor with a punchline.','Comedy'],['Did You Know?','Facts','A surprising fact with a short explanation.','Facts']];
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={view:'home',step:0,w:{topic:'',cat:'Motivation',lang:'English',plat:'TikTok',dur:30,tone:'Inspirational',out:'Complete reel package'},cur:null,more:false,q:'',sort:'new',variant:0,hk:'Curiosity',hkt:'',favs:[],projects:[],set:{theme:'dark',lang:'English',dur:30}};
function load(){try{const d=JSON.parse(localStorage.getItem('rf')||'{}');['projects','favs','set'].forEach(k=>d[k]&&(S[k]=d[k]));}catch(e){}document.documentElement.dataset.theme=S.set.theme;if(S.set.cat)S.w.cat=S.set.cat;S.w.dur=S.set.dur||30;S.w.lang=S.set.lang||'English';}
function save(){try{localStorage.setItem('rf',JSON.stringify({projects:S.projects,favs:S.favs,set:S.set}));}catch(e){toast('Could not save: browser storage unavailable.');}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2200);}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied'),()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Copy not supported')}a.remove();});}
function go(v){if(ED.run&&v!='editor'){toast('Preview or export is running. Press Stop first.');return;}if(S.view=='editor')saveEd(1);S.view=v;S.more=false;render();window.scrollTo(0,0);}
const proj=()=>S.projects.find(p=>p.id===S.cur);
function pick(a,i){return a[((i%a.length)+a.length)%a.length];}
function genOld(w,v){const t=w.topic.trim()||'your topic';const fill=s=>s.replace(/\{t\}/g,t);
const hk=fill(pick(Object.values(HOOKS).flat(),v*3+t.length));const lines=(BODY[w.cat]||BODY.Default).map(fill);const n={15:3,30:5,60:8,90:10}[w.dur];
const per=Math.round(w.dur/n);const sc=[];for(let i=0;i<n;i++){const L=i===0?hk:lines[(i-1+v)%lines.length];sc.push({text:L,vis:pick(VIS,i+v),dur:per});}
const cta=pick(CTAS,v);const id='p'+Date.now()+Math.random().toString(36).slice(2,5);const now=Date.now();
return{id,title:(t.length>40?t.slice(0,40)+'…':t),...w,hook:hk,cta,scenes:sc,status:'Draft',created:now,updated:now,caption:'',tags:[]};}
function tagsFor(p){const w=(p.topic||'').toLowerCase().split(/\W+/).filter(x=>x.length>3).slice(0,3);return[...new Set([...(TAGS[p.cat]||[]),...w,'reels','fyp'])].map(x=>'#'+x);}
function caps(p){const t=p.topic||'this';return{Short:`${p.hook}`,Storytelling:`${p.scenes[1]?.text||''} ${p.scenes[2]?.text||''} ${p.cta}`,Motivational:`${t}: start today. ${p.cta}`,Educational:`Quick lesson on ${t}. ${p.scenes.slice(1,3).map(s=>s.text).join(' ')}`,Business:`Discover ${t}. ${p.cta}`};}
function touch(){const p=proj();if(p){p.updated=Date.now();save();hpush();}}
function fmt(d){return new Date(d).toLocaleDateString();}
// views
const V={};
V.home=()=>`<div class="hero"><span class="tag">Welcome to ReelForge AI</span><h2>Turn an idea into a reel</h2><p>Plan the script, scenes and captions, then build and export a vertical video right in your browser. Free, with no account.</p><div class="row"><button class="b" onclick="go('create')">Create New Reel</button><button class="s" onclick="go('paste')">Paste your script</button></div></div>
<h3>Quick actions</h3><div class="g">${[['Script Generator','Motivation'],['Poetry Reel','Poetry'],['Motivational Reel','Motivation'],['Storytelling','Storytelling'],['Educational Reel','Education'],['Business Promotion','Business']].map(a=>`<button class="tile" onclick="S.w.cat='${a[1]}';S.step=0;go('create')"><span class="ti">${ico(QI[a[0]])}</span><b>${a[0]}</b><span class="mu">${QD[a[0]]}</span></button>`).join('')}</div>
<h3>Recent projects</h3>${S.projects.length?S.projects.slice().sort((a,b)=>b.updated-a.updated).slice(0,3).map(pc).join(''):'<div class="card mu">No projects yet. Create your first reel plan to see it here.</div>'}
<h3>Templates</h3><div class="row">${TEMPLATES.slice(0,4).map(t=>`<button class="s" onclick="S.w.cat='${t[3]}';S.step=0;go('create')">${t[0]}</button>`).join('')}<button class="s" onclick="go('templates')">All templates</button></div><div class="card"><b>Getting started</b>${ck()}<div class="row" style="margin-top:8px"><button class="s" onclick="sample()">Load sample project</button><button class="s" onclick="go('paste')">Paste your own script</button></div></div>`;
function pc(p){return`<div class="card row sp"><div><b>${E(p.title)}</b><div class="mu">${E(p.cat)} · ${p.status} · edited ${fmt(p.updated)}</div></div><button class="s" onclick="S.cur='${p.id}';go('script')">Open</button></div>`;}
const chips=(arr,key,cur)=>arr.map(a=>`<button class="chip ${a==cur?'on':''}" aria-pressed="${a==cur}" onclick="S.w.${key}=${typeof a==='number'?a:`'${a}'`};render()">${a}${typeof a==='number'?'s':''}</button>`).join('');
const STEPS=['Topic','Category','Language','Platform','Duration','Tone','Output'];
V.create=()=>{const s=S.step,w=S.w;let b='';
if(s==0)b=`<label for="tp">What is your video about?</label><input id="tp" value="${E(w.topic)}" oninput="S.w.topic=this.value" placeholder="e.g. Staying consistent">`;
if(s==1)b=chips(CATS,'cat',w.cat);
if(s==2)b=chips(['English','Urdu'],'lang',w.lang)+'<p class="mu">Templates exist in English and Urdu only. Urdu templates are general (not category-specific) and do not change with tone. For other languages, type or paste text in Script Studio.</p>';
if(s==3)b=chips(PLATS,'plat',w.plat)+'<p class="mu">Presets only. No automatic publishing.</p>';
if(s==4)b=chips(DURS,'dur',w.dur);
if(s==5)b=chips(TONES,'tone',w.tone);
if(s==6)b=chips(OUTS,'out',w.out);
return`<h2>Create Reel</h2><p class="mu">Step ${s+1} of 7: ${STEPS[s]}</p><div class="card">${b}<p id="er" class="warn" role="alert"></p></div>
<div class="row"><button class="s" onclick="S.step=0;go('home')">Cancel</button>${s>0?'<button class="s" onclick="S.step--;render()">Back</button>':''}${s<6?'<button class="b" onclick="nx()">Next</button>':'<button class="b" onclick="mk()">Generate</button>'}</div>`;};
function nx(){if(S.step==0&&!S.w.topic.trim()){$('#er').textContent='Please enter a topic.';return;}S.step++;render();}
function mk(){if(!S.w.topic.trim()){S.step=0;render();return;}const p=gen(S.w,0);if(['Caption','Hashtags','Complete reel package'].includes(p.out)){p.caption=caps(p).Short;p.tags=tagsFor(p);}S.projects.unshift(p);S.cur=p.id;save();S.step=0;go(['Caption','Hashtags'].includes(p.out)?'captions':'script');toast(['English','Urdu'].includes(p.lang)?'Template-based draft created':'Only English and Urdu templates exist; English was used');}
V.script=()=>{const p=proj();if(!p)return`<h2>Script Studio</h2><div class="card mu">No script open. Create a reel, paste your own script, or open a project.</div><div class="row"><button class="b" onclick="go('create')">Create Reel</button><button class="s" onclick="go('paste')">Paste Script</button></div>`;
hpush();const tot=p.scenes.reduce((a,s)=>a+(+s.dur||0),0);
return`<h2>Script Studio</h2><p class="mu">Generated from local templates (${E(p.lang||'English')}, ${E(p.tone||'')}, ${E(p.plat||'')}). No AI model was used. Output type: ${E(p.out||'')}.</p>${outPanel(p)}
<div class="card"><label for="ti">Title</label><input id="ti" value="${E(p.title)}" oninput="proj().title=this.value;touch()">
<label for="hk">Hook</label><textarea id="hk" oninput="proj().hook=this.value;proj().scenes[0].text=this.value;touch()">${E(p.hook)}</textarea>
<label for="ct">Call to action (optional)</label><input id="ct" value="${E(p.cta)}" oninput="proj().cta=this.value;touch()"></div>
<div class="row sp"><b>Scenes</b><span class="${tot>p.dur?'warn':'mu'}">Total ${tot}s / target ${p.dur}s${tot>p.dur?' (over target)':''}</span></div>
${p.scenes.map((s,i)=>`<div class="card"><b>Scene ${i+1}</b><label>Narration</label><textarea aria-label="Scene ${i+1} text" oninput="proj().scenes[${i}].text=this.value;touch()">${E(s.text)}</textarea><label>On-screen text (short, shown on the video)</label><input value="${E(ostOf(s))}" oninput="proj().scenes[${i}].ost=this.value;touch()"><label>Suggested visual</label><input value="${E(s.vis)}" oninput="proj().scenes[${i}].vis=this.value;touch()"><label>Media reference (file name or note, optional)</label><input value="${E(s.ref||'')}" oninput="proj().scenes[${i}].ref=this.value;touch()"><label>Seconds</label><input type="number" min="1" max="30" value="${s.dur}" onchange="proj().scenes[${i}].dur=+this.value;touch();render()">
<div class="row"><button class="s" ${i?'':'disabled'} onclick="mv(${i},-1)" aria-label="Move up">↑</button><button class="s" ${i<p.scenes.length-1?'':'disabled'} onclick="mv(${i},1)" aria-label="Move down">↓</button><button class="s" onclick="dp(${i})">Duplicate</button><button class="s" onclick="rm(${i})">Remove</button></div></div>`).join('')}
<div class="row"><button class="s" onclick="ad()">+ Add scene</button><button class="s" onclick="rg()">Regenerate (other template)</button><button class="s" onclick="copy(full())">Copy script</button><button class="s" onclick="fit()">Fit to target</button><button class="s" onclick="und(-1)">Undo</button><button class="s" onclick="und(1)">Redo</button><button class="s" onclick="touch();toast('Draft saved')">Save draft</button><button class="s" onclick="p2()">Duplicate project</button><button class="s" onclick="proj().status=proj().status=='Draft'?'Completed':'Draft';touch();render()">Mark ${p.status=='Draft'?'completed':'draft'}</button><button class="b" onclick="go('captions')">Captions</button></div>`;};
